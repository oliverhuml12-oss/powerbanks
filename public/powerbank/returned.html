<!DOCTYPE html>
<html lang="cs">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Powerbanka</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="phone">
  <div class="content">

    <div class="brand">
