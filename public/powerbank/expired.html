<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Powerbanka</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="phone">
  <div class="content">

    <div class="brand">
      <span class="logo">ϟ</span> POWERBANKY
    </div>

    <div class="powerbank-id">
      ID: <span>PB003</span>
    </div>

    <div class="divider"></div>

    <div class="status status-expired">
      STAV: EXPIROVANÁ
    </div>

    <h1>Powerbanka je expirovaná</h1>

    <p class="description">
      Lhůta pro vrácení powerbanky již uplynula.
    </p>

    <div class="big-icon expired-icon">
      !
    </div>

    <div class="info">

      <div class="info-title">
        Powerbanku již nelze vrátit.
      </div>

      <div class="info-text">
        Lhůta pro vrácení uplynula a platba za powerbanku propadá.
      </div>

    </div>

  </div>
</div>

</body>
</html>
