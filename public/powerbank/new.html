<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Powerbanka</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="phone">
  <div class="content">

    <div class="brand">
      <span class="logo">ϟ</span> POWERBANKY
    </div>

    <div class="powerbank-id">
      ID: <span>PB001</span>
    </div>

    <div class="divider"></div>

    <div class="status status-new">
      STAV: NOVÁ
    </div>

    <h1>Powerbanka je připravena</h1>

    <p class="description">
      Pro zapůjčení zadej manipulační kód.
    </p>

    <label class="label">
      Manipulační kód
    </label>

    <input
      type="text"
      placeholder="Zadej manipulační kód"
    >

    <button>
      Půjčit powerbanku
    </button>

    <div class="info">
      <div class="info-title">
        Lhůta pro vrácení je 7 dní.
      </div>

      <div class="info-text">
        Po zapůjčení můžeš powerbanku vrátit na kterémkoliv zapojeném místě.
      </div>
    </div>

  </div>
</div>

</body>
</html>
